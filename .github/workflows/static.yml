name: Seguridad y workflows
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 13 1 12 *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar Actions, expresiones y scripts shell
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -pyflakes=
          python3 -m unittest discover -s tools/tests
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      - run: uv python install 3.14
      - name: Auditar todas las dependencias resueltas del lockfile sin instalar el proyecto
        run: |
          uv export --locked --all-groups --no-emit-project --no-hashes --no-header --no-annotate --output-file "$RUNNER_TEMP/pyao-requirements.txt"
          uv tool run --python 3.14 --from pip-audit==2.10.1 pip-audit --requirement "$RUNNER_TEMP/pyao-requirements.txt" --no-deps --disable-pip
