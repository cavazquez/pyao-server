name: Server Snap

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, snapcraft_revision: 19274}
          - {arch: arm64, runner: ubuntu-24.04-arm, snapcraft_revision: 19281}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/stable
      - name: Instalar Snapcraft fijado
        run: |
          if snap list snapcraft >/dev/null 2>&1; then
            sudo snap refresh snapcraft --revision='${{ matrix.snapcraft_revision }}'
          else
            sudo snap install snapcraft --classic --revision='${{ matrix.snapcraft_revision }}'
          fi
      - name: Compilar con uv.lock y registrar hashes
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 scripts/build_snap.py --arch '${{ matrix.arch }}' 2>&1 | tee artifacts/snap-build.log
          sha256sum pyao_*_${{ matrix.arch }}.snap > artifacts/SHA256SUMS
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Instalar el paquete y probar recursos, TLS y reinicio con Redis descartable
        env:
          UV_PYTHON: "3.14"
        run: |
          sudo snap install ./pyao_*_${{ matrix.arch }}.snap --dangerous
          uv sync --locked --no-dev
          uv run --locked --no-dev python scripts/smoke_installed_snap.py --output artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pyao-server-snap-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            pyao_*.snap
            snap/pyao-source.json
            artifacts/
          retention-days: 7
