name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.1"
        enable-cache: true
    
    - name: Set up Python
      run: uv python install 3.14
    
    - name: Cache uv dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-
    
    - name: Install dependencies
      run: uv sync --locked --dev
    
    - name: Print tool versions
      run: |
        echo "📦 Tool versions:"
        echo "  Python: $(uv run python --version)"
        echo "  uv: $(uv --version)"
        echo "  ruff: $(uv run ruff --version)"
        echo "  mypy: $(uv run mypy --version)"
        echo "  pytest: $(uv run pytest --version)"
    
    - name: Run ruff linter
      run: uv run ruff check src tests
    
    - name: Run ruff formatter
      run: uv run ruff format --check .
    
    - name: Run mypy type checker
      run: uv run mypy src tests
    
    - name: Run tests with coverage
      run: uv run pytest -v -n auto --cov=src --cov-report=xml --cov-report=term-missing
  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.1"
        enable-cache: true
    
    - name: Set up Python
      run: uv python install 3.14
    
    - name: Cache uv dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ matrix.os }}-uv-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ matrix.os }}-uv-
    
    - name: Install dependencies
      run: uv sync --locked --all-groups
    
    - name: Print tool versions
      run: |
        echo "📦 Tool versions:"
        echo "  Python: $(uv run python --version)"
        echo "  uv: $(uv --version)"
    
    - name: Build package
      run: uv build
    
    - name: Install the original wheel in a clean environment
      run: uv run --locked --group build python -m src.operations.distribution validate --directory dist --platform ${{ matrix.os }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}
        path: dist/*
  
  snap:
    needs: test
    uses: ./.github/workflows/server-snap.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: dist-all
        merge-multiple: false
    
    - uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.1"
    - run: uv python install 3.14
    - run: uv sync --locked --group build
    - name: Assemble validated assets without filename collisions
      run: uv run --locked --group build python -m src.operations.distribution assemble --directory dist-all --output release-dist --canonical ubuntu-24.04

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: release-dist/*
        generate_release_notes: true
        make_latest: false
        prerelease: true
        fail_on_unmatched_files: true
