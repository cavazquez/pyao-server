name: Release GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag ya existente, fusionado en main y con la misma versión en ambos repositorios
        type: string
        required: true
      distribution_run:
        description: ID de CI ejecutado manualmente con build_packages=true
        type: string
        required: true
      snap_run:
        description: ID de Server Snap completado para ambas arquitecturas
        type: string
        required: true
      publish:
        description: Hacer pública la release tras verificar todos los archivos del borrador
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      DISTRIBUTION_RUN: ${{ inputs.distribution_run }}
      SNAP_RUN: ${{ inputs.snap_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar tag, commit fusionado y versión del servidor y cliente
        run: python3 tools/github_release.py preflight --tag "$TAG" --role server
      - name: Descargar sólo artefactos del commit exacto y de ejecuciones completas
        run: |
          gh api "repos/$GH_REPO/actions/runs/$DISTRIBUTION_RUN" > run.json
          gh api "repos/$GH_REPO/actions/runs/$DISTRIBUTION_RUN/jobs?per_page=100" > jobs.json
          python3 tools/github_release.py check-run --run run.json --jobs jobs.json --commit "$RELEASE_COMMIT" --workflow ci.yml --required test --required build-distribution
          gh run download "$DISTRIBUTION_RUN" --repo "$GH_REPO" --name validated-python-distribution --dir incoming/distribution
          gh api "repos/$GH_REPO/actions/runs/$SNAP_RUN" > run.json
          gh api "repos/$GH_REPO/actions/runs/$SNAP_RUN/jobs?per_page=100" > jobs.json
          python3 tools/github_release.py check-run --run run.json --jobs jobs.json --commit "$RELEASE_COMMIT" --workflow server-snap.yml --required 'package-and-smoke (amd64,*)' --required 'package-and-smoke (arm64,*)'
          for arch in amd64 arm64; do
            gh run download "$SNAP_RUN" --repo "$GH_REPO" --name "pyao-server-snap-$arch-$RELEASE_COMMIT" --dir "incoming/$arch"
          done
      - name: Preparar hashes y procedencia sin recompilar
        run: python3 tools/github_release.py prepare --directory incoming --output release-dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --role server
      - name: Crear borrador completo sin sobreescribir una release existente
        run: |
          prerelease=()
          if [ "$RELEASE_PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" release-dist/* --repo "$GH_REPO" --verify-tag --draft --latest=false "${prerelease[@]}" --title "${GH_REPO##*/} $RELEASE_VERSION" --notes "Artefactos verificados de $RELEASE_COMMIT. Versión común de servidor y cliente: $RELEASE_VERSION. SHA256SUMS y release-manifest.json documentan los archivos publicados."
      - name: Verificar los archivos descargados del borrador
        run: |
          gh release download "$TAG" --repo "$GH_REPO" --dir verified
          cd verified
          sha256sum --check ../release-dist/SHA256SUMS
          cmp SHA256SUMS ../release-dist/SHA256SUMS
      - name: Publicar el borrador verificado
        if: inputs.publish
        run: |
          latest=false
          if [ "$RELEASE_PRERELEASE" = false ]; then latest=true; fi
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease="$RELEASE_PRERELEASE" --latest="$latest"
