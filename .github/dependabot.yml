version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 20
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /.github/link-check
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Argentina/Buenos_Aires
    groups:
      link-check:
        patterns: ["*"]
