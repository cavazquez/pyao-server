version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 13 1 12 *"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: cron
      cronjob: "0 13 1 12 *"
    open-pull-requests-limit: 20
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /.github/link-check
    schedule:
      interval: cron
      cronjob: "0 13 1 12 *"
    groups:
      link-check:
        patterns: ["*"]
