name: pyao
base: core26
icon: data/desktop/icons/pyao-server.svg
summary: Servidor de Argentum Online en Python
description: |
  Servidor de ProyectoAO con Python 3.14 y los recursos completos del juego.
  Requiere Redis con autenticación y persistencia AOF. Configure el endpoint
  con PYAO_REDIS__HOST, PYAO_REDIS__PORT y PYAO_REDIS__PASSWORD_FILE.
  La configuración y los respaldos permanecen en SNAP_USER_COMMON.
  Las partidas se conservan en Redis; sus migraciones requieren respaldo
  verificado y una orden explícita del operador con el servidor detenido.
license: Apache-2.0
grade: devel
confinement: strict
adopt-info: pyao
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  pyao-server:
    command: bin/wrapper
    plugs: [network, network-bind]

  pyao-server-indicator:
    command: bin/indicator-wrapper
    plugs: [network, network-bind, desktop, desktop-legacy, x11, unity7]
    desktop: share/applications/pyao-server.desktop

parts:
  tray:
    plugin: nil
    source: .
    build-packages: [gcc, pkg-config, libgtk-3-dev, libayatana-appindicator3-dev, python3]
    stage-packages: [libgtk-3-0t64, libayatana-appindicator3-1, xdg-utils]
    override-build: |
      python3 tools/build_tray.py
      install -Dm755 build/desktop/pyao-tray "$CRAFT_PART_INSTALL/bin/pyao-tray"
      install -Dm644 snap/gui/pyao-server.desktop "$CRAFT_PART_INSTALL/share/applications/pyao-server.desktop"
      install -Dm644 data/desktop/icons/pyao-server-128.png "$CRAFT_PART_INSTALL/share/icons/hicolor/128x128/apps/pyao-server.png"
  python-runtime:
    plugin: nil
    stage-packages:
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - python3-minimal
      - python3.14-minimal
      - python3.14-venv

  uv-deps:
    plugin: nil
    build-packages: [curl, ca-certificates]
    override-build: |
      set -eu
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          target=x86_64-unknown-linux-gnu
          digest=eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
          ;;
        arm64)
          target=aarch64-unknown-linux-gnu
          digest=9041c73c99fdc5892cf128140beb354eca9231d502068cc36e6cb53a8e59ad14
          ;;
        *) exit 1 ;;
      esac
      curl --fail --location --retry 3 --output uv.tar.gz "https://github.com/astral-sh/uv/releases/download/0.13.1/uv-$target.tar.gz"
      printf '%s  uv.tar.gz\n' "$digest" | sha256sum --check
      tar -xzf uv.tar.gz --strip-components=1
      install -Dm755 uv "$CRAFT_PART_INSTALL/bin/uv"
    stage: [bin/uv]
    prime: ['-*']

  pyao:
    after: [python-runtime, uv-deps]
    plugin: uv
    source: .
    build-packages: [gcc, libffi-dev, libssl-dev]
    override-build: |
      set -eu
      craftctl default
      # uv conserva alias al intérprete staged; todos deben apuntar al payload.
      for interpreter in python python3 python3.14; do
        ln -sfn ../usr/bin/python3.14 "$CRAFT_PART_INSTALL/bin/$interpreter"
      done
      install -Dm644 "$CRAFT_PROJECT_DIR/snap/pyao-source.json" "$CRAFT_PART_INSTALL/share/doc/pyao/provenance.json"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/pyao/LICENSE"
      install -Dm644 docs/guides/REDIS.md "$CRAFT_PART_INSTALL/share/doc/pyao/REDIS.md"
      install -Dm644 docs/guides/SNAP.md "$CRAFT_PART_INSTALL/share/doc/pyao/SNAP.md"
      version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
      craftctl set version="$version"

  wrapper:
    plugin: dump
    source: snap/local/
    organize:
      wrapper: bin/wrapper
      indicator-wrapper: bin/indicator-wrapper
