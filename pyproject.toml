[project]
name = "pyao-server"
version = "1.0.0rc6"
description = "Servidor de Argentum Online en Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "redis==8.1.0",
    "argon2-cffi==25.1.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.2",
    "msgpack>=1.2.1",
    "websockets==17.2",
]

[project.optional-dependencies]
desktop = ["pystray==0.19.5; sys_platform != 'linux'"]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mypy==2.4.0",
    "fakeredis==2.40.0",
    "pre-commit>=4.6.0",
]
build = [
    "hatchling==1.32.4",
    "packaging==26.3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "tools"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "src/runtime_data/data"
"config" = "src/runtime_data/config"
"archives/map_data.xz" = "src/runtime_data/archives/map_data.xz"
"redis" = "src/runtime_data/redis"

[project.scripts]
pyao-server = "src.run_server:main"
pyao-server-indicator = "src.desktop.indicator:main"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tools", "scripts"]

[tool.ruff.lint]
select = [
    "ALL"  # Habilitar todas las reglas
]
ignore = [
    "D203",    # one-blank-line-before-class (conflicto con D211)
    "D213",    # multi-line-summary-second-line (conflicto con D212)
    "COM812",  # missing-trailing-comma (conflicto con formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicto con formatter)
    "T201",    # print statements (permitido)
    "CPY001",  # copyright notice (no requerido)
    "S104",    # binding to all interfaces (intencional para servidor)
    "TC003",   # asyncio usado en runtime, no solo type-checking
    "FIX002",  # line-contains-todo (permitido)
    "TD002",   # missing author in TODO (no requerido)
    "TD003",   # missing issue link in TODO (no requerido)
    "PLR0904", # Too many public methods
    "PLR0913", # too many arguments (necesario para protocolos)
    "PLR0917", # too many positional arguments (necesario para protocolos)
    "PLR0911", # too many return statements (lógica de negocio compleja)
    "PLR0912", # too many branches (lógica de negocio compleja con validaciones)
    "PLR0904", # too many public methods (permitido en todo el proyecto)
    "FBT001",  # boolean positional argument (necesario para protocolos)
    "FBT002",  # boolean default positional argument (necesario para NPCs)
    "C901",    # function is too complex (lógica de negocio compleja)
    "S311",    # standard pseudo-random generators (aceptable para NPCs/juego)
    "PLR6301", # method could be static (Strategy Pattern requiere instancias)
]
preview = true  # Habilitar reglas experimentales
# Conservar las reglas preview ya revisadas; las nuevas se habilitan explícitamente.
explicit-preview-rules = true
extend-select = [
    "AIR003", "AIR004", "AIR201", "AIR304", "AIR321", "B043", "B901", "B903",
    "B909", "D420", "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501",
    "DOC502", "E111", "E112", "E113", "E114", "E115", "E116", "E117",
    "E201", "E202", "E203", "E204", "E211", "E221", "E222", "E223",
    "E224", "E225", "E226", "E227", "E228", "E231", "E241", "E242",
    "E251", "E252", "E261", "E262", "E265", "E266", "E271", "E272",
    "E273", "E274", "E275", "E301", "E302", "E303", "E304", "E305",
    "E306", "E502", "FURB101", "FURB103", "FURB113", "FURB118", "FURB131", "FURB140",
    "FURB142", "FURB145", "FURB148", "FURB152", "FURB154", "FURB156", "FURB180", "FURB189",
    "PLC1901", "PLC2701", "PLC2801", "PLE1141", "PLE4703", "PLR0202", "PLR0203", "PLR0904",
    "PLR0914", "PLR0916", "PLR1702", "PLR1712", "PLR6104", "PLR6201", "PLR6301", "PLW0244",
    "PLW1514", "PLW3201", "PT029", "RUF027", "RUF029", "RUF031", "RUF038", "RUF039",
    "RUF045", "RUF047", "RUF050", "RUF052", "RUF054", "RUF055", "RUF056", "RUF065",
    "RUF066", "RUF067", "RUF069", "RUF070", "RUF072", "RUF073", "S401", "S402",
    "S403", "S404", "S405", "S406", "S407", "S408", "S409", "S411",
    "S412", "S413", "S415", "TC008", "W391",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-public-methods = 30
max-returns = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tools.*"
ignore_errors = true  # parsers y herramientas auxiliares usan tipos dinámicos

[[tool.mypy.overrides]]
module = "src.utils.redis_client"
ignore_errors = true  # wrappers de Redis con union types (fakeredis + redis async)

[[tool.mypy.overrides]]
module = "src.network.packet_reader_mixin"
ignore_errors = true  # mixin: reader/errors definidos en subclase

[[tool.mypy.overrides]]
module = "src.repositories.player_mixins.*"
ignore_errors = true  # mixins: redis y helpers provistos por PlayerRepositoryBase en runtime

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# No fallar si no hay tests
addopts = "--strict-markers -q"
# Silenciar warning de GIL en Python 3.13+ (msgpack no declara compatibilidad)
filterwarnings = [
    "ignore::RuntimeWarning:importlib._bootstrap:491",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert permitido en tests
    "S105",    # contraseñas hardcodeadas (strings literales) permitidas en tests
    "S107",    # contraseñas hardcodeadas en defaults de funciones helper permitidas en tests
    "PLR2004", # magic values permitidos en tests
    "D101",    # docstring en clases de test no requerido
    "D102",    # docstring en métodos de test no requerido
    "D104",    # docstring en __init__.py no requerido
    "PLR6301", # métodos de test pueden usar self
    "ERA001",  # código comentado permitido en tests
    "ANN001",  # anotaciones de tipos no requeridas en tests
    "ANN201",  # return type annotation no requerida en tests
    "ANN202",  # return type annotation no requerida en funciones privadas de tests
    "DOC201",  # return documentation no requerida en fixtures
    "RUF029",  # async sin await permitido en mocks
    "SIM118",  # simplificaciones no requeridas en tests
    "SLF001",  # acceso a miembros privados permitido en tests
    "FBT003",  # boolean positional en assert_called_once_with
]
"tools/**/*.py" = [
    "PLR1702", # parsers pueden tener muchos bloques anidados
    "C901",    # parsers pueden ser complejos
    "PLR0912", # parsers pueden tener muchas ramas
]
"src/bank_repository.py" = [
    "UP037",   # quotes necesarias para TYPE_CHECKING
]
"src/inventory_repository.py" = [
    "UP037",   # quotes necesarias para TYPE_CHECKING
]
"src/run_server.py" = [
    "E402",    # imports después de warnings.filterwarnings (necesario para GIL)
]
"src/services/map/cache.py" = [
    "D103",  # funciones de módulo; docstrings breves
    "DOC201",
    "DOC501",
]
"src/services/map/map_resources_service.py" = [
    "DOC201",  # API pública documentada en resumen; Returns redundantes
]
"src/services/map/map_resource_queries.py" = [
    "D103",
    "DOC201",
]
"src/services/map/map_bulk_resources_loader.py" = [
    "D103",
    "DOC201",
]
"src/services/map/ndjson_reader.py" = [
    "D103",
    "DOC201",
]
"src/services/map/map_single_map_loader.py" = [
    "DOC201",
]
"src/utils/redis_client.py" = [
    "DOC201",  # wrapper methods delegan a Redis
    "DOC501",  # RuntimeError documentado en __init__
]
