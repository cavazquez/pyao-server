# Configuración del servidor PyAO
# Todas las opciones también pueden sobreescribirse con variables de entorno.
# Ejemplo: PYAO_SERVER__PORT=8000

[server]
host = "0.0.0.0"
port = 7666
max_connections = 1000
buffer_size = 4096
outgoing_max_packets = 128
outgoing_max_bytes = 262144
outgoing_drain_timeout = 5.0

[redis]
host = "localhost"
port = 6379
db = 0
max_connections = 20
socket_timeout = 5.0
socket_connect_timeout = 5.0

[logging]
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = "logs/server.log"

[game]
max_players_per_map = 100
respawn_check_interval = 5.0
npc_respawn_base_time = 30.0
npc_respawn_random_variance = 15.0

[game.combat]
melee_range = 1
base_critical_chance = 0.15
base_dodge_chance = 0.05
defense_per_level = 0.1
armor_reduction = 0.1
critical_damage_multiplier = 2.0
critical_agi_modifier = 0.005
dodge_agi_modifier = 0.007
max_critical_chance = 0.50
max_dodge_chance = 0.40
base_agility = 10

[game.work]
exp_wood = 10
exp_mineral = 15
exp_fish = 12
exp_per_level = 100
max_work_distance = 1

[game.stamina]
max_stamina = 100
stamina_regen_rate = 1.0
stamina_drain_rate = 2.0
cost_walk = 1
cost_attack = 2
cost_spell = 3
cost_work = 5
regen_tick = 2
regen_resting = 5

[game.hunger_thirst]
enabled = true
interval_sed = 180
interval_hambre = 180
reduccion_agua = 10
reduccion_hambre = 10

[game.gold_decay]
enabled = true
percentage = 1.0
interval_seconds = 60.0

[game.inventory]
max_slots = 30

[game.bank]
max_slots = 40

[game.character]
hp_per_con = 10
mana_per_int = 10
initial_gold = 0
initial_elu = 300
elu_exponent = 1.8

[security]
# Cada hash usa ~64 MiB; limitar también las solicitudes pendientes.
hash_workers = 2
hash_max_pending = 4
auth_timeout_seconds = 30.0
auth_window_seconds = 60.0
auth_attempts_per_connection = 6
auth_attempts_per_ip = 30
auth_attempts_per_account = 8
auth_max_keys = 10000
session_lease_seconds = 90

# Cadencias mínimas del servidor, independientes del cliente y del reloj de pared.
[game.cadence]
walk_seconds = 0.2
attack_seconds = 0.5
cast_seconds = 1.0

[game.spells]
development_all_spells = false

# Dardo Mágico (2) y Curar Heridas Leves (3), entregados sólo al crear la cuenta.
[game.spells.starter_by_class]
1 = [2, 3]
2 = [2, 3]
3 = [2, 3]
4 = [2, 3]
5 = [2, 3]
6 = [2, 3]
7 = [2, 3]
8 = [2, 3]
9 = [2, 3]
10 = [2, 3]
11 = [2, 3]
12 = [2, 3]
