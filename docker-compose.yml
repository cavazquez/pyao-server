# Docker Compose para desarrollo local de PyAO Server
#
# Uso básico (solo Redis):
#   docker compose up -d
#
# Con Redis Insight (GUI de monitoreo):
#   docker compose --profile tools up -d
#
# Detener todo:
#   docker compose --profile tools down
#
# Ver logs:
#   docker compose logs -f redis

services:
  redis:
    build: ./redis
    container_name: pyao-redis
    ports:
      - "127.0.0.1:${PYAO_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    secrets:
      - redis_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-insight:
    image: redis/redisinsight:latest
    container_name: pyao-redis-insight
    ports:
      - "127.0.0.1:${PYAO_REDIS_INSIGHT_PORT:-5540}:5540"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tools

volumes:
  redis-data:

secrets:
  redis_password:
    file: ${PYAO_REDIS_PASSWORD_FILE:-./.local/redis-password}
