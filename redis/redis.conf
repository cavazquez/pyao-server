# Progreso persistido: el directorio completo se monta como volumen.
bind 0.0.0.0
protected-mode yes
port 6379
dir /data
daemonize no
logfile ""
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# Los commits del juego esperan WAITAOF antes de publicar. everysec agrega hasta
# un segundo por barrera; always conserva fsync y evita esa espera periódica.
appendfsync always
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
rdbchecksum yes
stop-writes-on-bgsave-error yes
maxmemory-policy noeviction
